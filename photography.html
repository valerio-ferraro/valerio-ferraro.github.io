<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photography | Valerio Ferraro</title>
    <meta name="description" content="Valerio Ferraro’s photography portfolio. A selection in preparation." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <link rel="stylesheet" href="./assets/css/photography.css" />
    <script type="module" blocking="render" src="./assets/js/main.js"></script>
  </head>
  <body class="photography-page">
    <a class="skip-link" href="#main">Skip to photographs</a>
    <header class="site-header">
      <a class="wordmark" href="./index.html">Valerio Ferraro</a>
      <nav aria-label="Main navigation">
        <a href="./index.html">About</a>
        <a href="./research.html">Research</a>
        <a aria-current="page" href="./photography.html">Photography</a>
      </nav>
    </header>
    <main id="main">
      <div class="portfolio-heading">
        <h1>Photography</h1>
        <p class="portfolio-intro">
          A portfolio in preparation.<br />
          These are illustrative placeholders,<br class="desktop-break" /> not my photographs.
        </p>
      </div>
      <div class="portfolio-toolbar">
        <p class="portfolio-count">Six studies <span aria-hidden="true">/</span> 01–06</p>
        <div class="portfolio-views" data-gallery-controls role="group" aria-label="Gallery view" hidden>
          <button type="button" data-layout="sequence" aria-pressed="false">Sequence</button>
          <button type="button" data-layout="index" aria-pressed="true">Contact sheet</button>
        </div>
      </div>
      <section class="gallery" aria-label="Illustrative gallery studies">
        <figure class="gallery-item" id="study-01">
          <a href="./images/photo-01.svg" data-photo="0" aria-label="Enlarge illustrative study: Morning river">
            <img src="./images/photo-01.svg" width="1600" height="1000"
              alt="Illustration: Warm morning light over a riverbank" fetchpriority="high" />
          </a>
          <figcaption><span data-photo-title>Morning river</span><span aria-hidden="true">01</span></figcaption>
        </figure>
        <figure class="gallery-item" id="study-02">
          <a href="./images/photo-02.svg" data-photo="1" aria-label="Enlarge illustrative study: City layers">
            <img src="./images/photo-02.svg" width="1600" height="1000"
              alt="Illustration: City skyline under an overcast sky" loading="lazy" />
          </a>
          <figcaption><span data-photo-title>City layers</span><span aria-hidden="true">02</span></figcaption>
        </figure>
        <figure class="gallery-item" id="study-03">
          <a href="./images/photo-03.svg" data-photo="2" aria-label="Enlarge illustrative study: Alpine outline">
            <img src="./images/photo-03.svg" width="1600" height="1000"
              alt="Illustration: Mountain silhouettes against a pale sky" loading="lazy" />
          </a>
          <figcaption><span data-photo-title>Alpine outline</span><span aria-hidden="true">03</span></figcaption>
        </figure>
        <figure class="gallery-item" id="study-04">
          <a href="./images/photo-04.svg" data-photo="3" aria-label="Enlarge illustrative study: Coastal distance">
            <img src="./images/photo-04.svg" width="1600" height="1000"
              alt="Illustration: Coastline and blue water" loading="lazy" />
          </a>
          <figcaption><span data-photo-title>Coastal distance</span><span aria-hidden="true">04</span></figcaption>
        </figure>
        <figure class="gallery-item" id="study-05">
          <a href="./images/photo-05.svg" data-photo="4" aria-label="Enlarge illustrative study: Courtyard geometry">
            <img src="./images/photo-05.svg" width="1600" height="1000"
              alt="Illustration: Shadows in a stone courtyard" loading="lazy" />
          </a>
          <figcaption><span data-photo-title>Courtyard geometry</span><span aria-hidden="true">05</span></figcaption>
        </figure>
        <figure class="gallery-item" id="study-06">
          <a href="./images/photo-06.svg" data-photo="5" aria-label="Enlarge illustrative study: Last light">
            <img src="./images/photo-06.svg" width="1600" height="1000"
              alt="Illustration: Sunset over a field" loading="lazy" />
          </a>
          <figcaption><span data-photo-title>Last light</span><span aria-hidden="true">06</span></figcaption>
        </figure>
      </section>
      <dialog class="lightbox" aria-label="Image viewer" aria-describedby="image-caption">
        <div class="lightbox-top">
          <p class="viewer-identity">Valerio Ferraro <span aria-hidden="true">/</span> Photography</p>
          <button type="button" data-close aria-label="Close image viewer">Close <span aria-hidden="true">×</span></button>
        </div>
        <div class="lightbox-image-stage"><img data-lightbox-image alt="" /></div>
        <div class="lightbox-bottom">
          <button type="button" data-prev aria-label="Previous image"><span aria-hidden="true">←</span> Previous</button>
          <div class="lightbox-caption">
            <p id="image-caption" data-photo-caption></p>
            <p data-photo-count aria-live="polite" aria-atomic="true"></p>
          </div>
          <button type="button" data-next aria-label="Next image">Next <span aria-hidden="true">→</span></button>
        </div>
      </dialog>
    </main>
    <footer class="site-footer">
      <p>Portfolio in preparation.</p>
      <div class="photo-footer-links">
        <a href="mailto:acferraro.valerio@gmail.com">Email</a>
        <a href="#main">Back to top <span aria-hidden="true">↑</span></a>
      </div>
    </footer>
  </body>
</html>
