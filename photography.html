<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photography | Valerio Ferraro</title>
    <meta
      name="description"
      content="Economics researcher studying beliefs, narratives, information and financial decisions."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fefefe" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <script type="module" src="./assets/js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="./index.html">Valerio Ferraro</a>
      <nav aria-label="Main navigation">
        <a href="./index.html">About</a><a href="./research.html">Research</a
        ><a aria-current="page" href="./photography.html">Photography</a>
      </nav>
    </header>
    <main id="main">
      <h1>Photography</h1>
      <p class="gallery-notice">
        Portfolio in preparation. These are demonstration images, not my
        photographs.
      </p>
      <section class="gallery" aria-label="Illustrative gallery studies">
        <figure class="gallery-item">
          <button
            data-photo="0"
            aria-label="Enlarge illustrative study: Morning river"
          >
            <img
              src="./images/photo-01.svg"
              width="1600"
              height="1000"
              alt="Illustration: Warm morning light over a riverbank"
              loading="lazy"
            /><span class="image-open" aria-hidden="true">↗</span>
          </button>
          <figcaption>
            <span>Morning river</span>
          </figcaption>
        </figure>
        <figure class="gallery-item">
          <button
            data-photo="1"
            aria-label="Enlarge illustrative study: City layers"
          >
            <img
              src="./images/photo-02.svg"
              width="1600"
              height="1000"
              alt="Illustration: City skyline under an overcast sky"
              loading="lazy"
            /><span class="image-open" aria-hidden="true">↗</span>
          </button>
          <figcaption>
            <span>City layers</span>
          </figcaption>
        </figure>
        <figure class="gallery-item">
          <button
            data-photo="2"
            aria-label="Enlarge illustrative study: Alpine outline"
          >
            <img
              src="./images/photo-03.svg"
              width="1600"
              height="1000"
              alt="Illustration: Mountain silhouettes against a pale sky"
              loading="lazy"
            /><span class="image-open" aria-hidden="true">↗</span>
          </button>
          <figcaption>
            <span>Alpine outline</span>
          </figcaption>
        </figure>
        <figure class="gallery-item">
          <button
            data-photo="3"
            aria-label="Enlarge illustrative study: Coastal distance"
          >
            <img
              src="./images/photo-04.svg"
              width="1600"
              height="1000"
              alt="Illustration: Coastline and blue water"
              loading="lazy"
            /><span class="image-open" aria-hidden="true">↗</span>
          </button>
          <figcaption>
            <span>Coastal distance</span>
          </figcaption>
        </figure>
        <figure class="gallery-item">
          <button
            data-photo="4"
            aria-label="Enlarge illustrative study: Courtyard geometry"
          >
            <img
              src="./images/photo-05.svg"
              width="1600"
              height="1000"
              alt="Illustration: Shadows in a stone courtyard"
              loading="lazy"
            /><span class="image-open" aria-hidden="true">↗</span>
          </button>
          <figcaption>
            <span>Courtyard geometry</span>
          </figcaption>
        </figure>
        <figure class="gallery-item">
          <button
            data-photo="5"
            aria-label="Enlarge illustrative study: Last light"
          >
            <img
              src="./images/photo-06.svg"
              width="1600"
              height="1000"
              alt="Illustration: Sunset over a field"
              loading="lazy"
            /><span class="image-open" aria-hidden="true">↗</span>
          </button>
          <figcaption>
            <span>Last light</span>
          </figcaption>
        </figure>
      </section>
      <dialog class="lightbox" aria-label="Illustrative study viewer">
        <div class="lightbox-top">
          <button data-close aria-label="Close image viewer">Close ×</button>
        </div>
        <img data-lightbox-image alt="" />
        <div class="lightbox-bottom">
          <button data-prev aria-label="Previous image">← Previous</button>
          <p data-photo-caption></p>
          <button data-next aria-label="Next image">Next →</button>
        </div>
      </dialog>
    </main>
    <footer class="site-footer">
      <a href="mailto:acferraro.valerio@gmail.com">Email</a
      ><a href="https://www.linkedin.com/in/valerioferraro-p1">LinkedIn</a
      ><a href="https://github.com/valerio-ferraro">GitHub</a>
    </footer>
  </body>
</html>
